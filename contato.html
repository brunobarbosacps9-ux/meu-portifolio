<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Formulário de Contato</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 36px;
        width: 100%;
        max-width: 500px;
        border: 1px solid #e0e0e0;
      }

      h1 {
        color: #2c3e50;
        margin-bottom: 24px;
        font-size: 26px;
      }

      label {
        display: block;
        font-size: 14px;
        color: #555;
        margin-bottom: 6px;
        margin-top: 16px;
      }

      input, textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus, textarea:focus {
        border-color: #2980b9;
      }

      textarea {
        height: 120px;
        resize: vertical;
      }

      .botao {
        width: 100%;
        margin-top: 24px;
        padding: 12px;
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      .botao:hover {
        background-color: #1a6a9a;
      }

      #mensagem-enviada {
        display: none;
        margin-top: 16px;
        background-color: #2ecc71;
        color: white;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h1>Fale comigo</h1>

      <label>Seu nome</label>
      <input type="text" id="nome" placeholder="Ex: Bruno">

      <label>Seu email</label>
      <input type="email" id="email" placeholder="Ex: bruno@gmail.com">

      <label>Assunto</label>
      <input type="text" id="assunto" placeholder="Ex: Quero um site">

      <label>Mensagem</label>
      <textarea id="mensagem" placeholder="Escreva sua mensagem aqui..."></textarea>

      <button class="botao" onclick="enviar()">Enviar mensagem</button>

      <div id="mensagem-enviada">✅ Mensagem enviada com sucesso!</div>
    </div>

    <script>
      function enviar() {
        let nome = document.getElementById("nome").value;

        if (nome === "") {
          alert("Por favor, preencha seu nome!");
          return;
        }

        document.getElementById("mensagem-enviada").style.display = "block";
      }
    </script>

  </body>
</html>
